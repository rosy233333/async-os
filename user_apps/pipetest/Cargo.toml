[package]
name = "pipetest"
version = "0.1.0"
edition = "2021"

[dependencies]
user-lib = { path = "../../user-lib" }

[features]
async-await = []
async-non-await = ["user-lib/thread-api"]
non-async-non-await = ["user-lib/thread-api"]
blocking = ["user-lib/blocking"]
default = ["non-async-non-await"]
